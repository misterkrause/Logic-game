# Netlify hosts the web build of the Expo app.
# The same source still builds native Android/iOS apps via Expo/EAS.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html so reloads work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles can be cached forever; index.html must always revalidate.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
